[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Serverless Functions bleiben im Code unter /api/* ansprechbar; Netlify legt
# sie intern unter /.netlify/functions/* ab.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA-Fallback für React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
